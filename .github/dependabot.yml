# Weekly dependency update PRs (#22). Minor and patch updates are grouped into one PR per
# ecosystem so they stay easy to review; major updates get their own PR.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "team: infra-security"]
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    labels: ["dependencies", "team: infra-security"]
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels: ["dependencies", "team: infra-security"]
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /discord-bots/team-bot]
    schedule:
      interval: weekly
    labels: ["dependencies", "team: infra-security"]
