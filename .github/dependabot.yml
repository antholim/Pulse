# Monthly dependency update PRs (#22): at most one grouped PR per ecosystem.
#
# Major upgrades are team decisions, so Dependabot does not propose them for the backend,
# frontend or Docker images. The runtimes are pinned on purpose (Python 3.12 in
# backend/pyproject.toml, Node 22 in .nvmrc), and for Docker tags a Python 3.12 to 3.13 bump
# counts as a minor update, so images only get patch updates. Security alerts are separate
# and are not affected by this schedule.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "team: infra-security"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    labels: ["dependencies", "team: infra-security"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    labels: ["dependencies", "team: infra-security"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /discord-bots/team-bot]
    schedule:
      interval: monthly
    labels: ["dependencies", "team: infra-security"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker:
        patterns: ["*"]
