name: team-bot

on:
  push:
    branches: [main]
    paths:
      - "discord-bots/team-bot/**"
      - ".github/workflows/team-bot.yml"
  pull_request:
    paths:
      - "discord-bots/team-bot/**"
      - ".github/workflows/team-bot.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bots/team-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: discord-bots/team-bot/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  deploy:
    # Ship to Fly only after the tests pass on a push to main, never from a PR.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits instead of racing the running one.
    concurrency:
      group: team-bot-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: discord-bots/team-bot
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
