name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The ESLint and Prettier hooks run the versions installed in frontend/node_modules.
      - run: npm ci
        working-directory: frontend
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pulse:pulse@localhost:5432/pulse_test
      # Turns on the integration tests (backend/tests/integration) against the service above.
      TEST_DATABASE_URL: postgresql+psycopg://pulse:pulse@localhost:5432/pulse_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      # Fails below the coverage minimum in pyproject.toml.
      # coverage.xml is the report uploaded to Codecov below.
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      # Shows the coverage table on the run summary, linked from the PR checks.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          [ -f .coverage ] || exit 0
          printf "### Backend coverage\n\n" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      # Sends the report to Codecov, which comments the patch coverage on the PR.
      # Runs even when the coverage minimum fails, so the PR still gets the report.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          disable_search: true
          flags: backend
          name: backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Fails below the coverage thresholds in vite.config.ts.
      - run: npm run coverage
      # Shows the coverage table on the run summary, linked from the PR checks.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const total = require("./coverage/coverage-summary.json").total;
            const rows = ["statements", "branches", "functions", "lines"].map(
              (k) => `| ${k} | ${total[k].covered} / ${total[k].total} | ${total[k].pct}% |`,
            );
            console.log(["### Frontend coverage", "", "| Metric | Covered | Cover |", "| --- | ---: | ---: |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      # Sends the report to Codecov, which comments the patch coverage on the PR.
      # Runs even when the coverage thresholds fail, so the PR still gets the report.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          disable_search: true
          flags: frontend
          name: frontend
      - run: npm run build

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
