name: Bug Report
description: Something in PULSE is not working as expected
title: "[Bug] <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Add the affected **feature label** and a **priority** label.

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["High (blocks the demo / pipeline)", "Medium", "Low"]
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Logs, screenshots, environment
      render: shell
