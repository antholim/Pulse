# AI declaration: 50% or more AI-generated
# Other names of one city, mapped to a single key by normalize_city.
# Each key is the city; its list holds the other names it goes by, in any spelling.
# Hyphens, accents, case and St/Ste abbreviations are already handled in code.
[aliases]
quebec = ["Quebec City", "Québec City", "Ville de Québec", "City of Quebec"]
montreal = ["Ville de Montréal", "City of Montreal"]
levis = ["Ville de Lévis", "City of Levis"]
saguenay = ["Ville de Saguenay", "City of Saguenay"]
sherbrooke = ["Ville de Sherbrooke", "City of Sherbrooke"]
"trois rivieres" = ["Ville de Trois-Rivières", "City of Trois-Rivieres", "Three Rivers"]
