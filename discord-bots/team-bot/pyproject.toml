[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "team-bot"
version = "0.1.0"
description = "Internal Discord bot for the PULSE team: work logging, reminders and GitHub summaries"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "discord.py>=2.4,<3",
    "githubkit>=0.12,<1",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
team-bot = "team_bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/team_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    # discord.py imports audioop for voice support, which this bot does not use.
    "ignore:'audioop' is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["team_bot"]
# These only read slash command options and reply, which needs a live Discord connection.
# The logic they call lives in domain/, services/ and formatting.py and is unit tested.
# The scheduled jobs and /run (cogs/deadlines, meetings, pr_summary, run) are measured.
omit = [
    "src/team_bot/__main__.py",
    "src/team_bot/bot.py",
    "src/team_bot/cogs/general.py",
    "src/team_bot/cogs/worklog.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["team_bot"]
known-local-folder = ["conftest", "tests_support"]
