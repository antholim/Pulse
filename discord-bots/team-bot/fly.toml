# fly.toml app configuration file generated for zit-verse-bot on 2026-10-20T02:39:32Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zit-verse-bot'
primary_region = 'yyz'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'

# No [http_service]: the bot serves no HTTP and only holds an outgoing Discord connection.
# With one, Fly's proxy sees no traffic, stops the machine, and nothing ever starts it again.

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
