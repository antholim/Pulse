services:
  # PostgreSQL database
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway PostgreSQL for integration tests (data kept in memory)
  test-db:
    profiles: ["test"]
    image: postgres:17
    environment:
      POSTGRES_USER: pulse_test
      POSTGRES_PASSWORD: pulse_test
      POSTGRES_DB: pulse_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U pulse_test -d pulse_test
      interval: 2s
      timeout: 5s
      retries: 15

  # FastAPI backend
  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Defaults point at the mock-omerlo service; set OMERLO_* in .env to use staging.
      OMERLO_BASE_URL: ${OMERLO_BASE_URL:-http://mock-omerlo:8100/api}
      OMERLO_API_KEY: ${OMERLO_API_KEY:-mock-demo-capitale}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  # Mock Omerlo backoffice API serving synthetic data (backend/synthetic/README.md)
  mock-omerlo:
    profiles: ["full", "mock"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - ./backend/synthetic:/app/synthetic
    command:
      - python
      - -m
      - synthetic.mock_omerlo
      - --host
      - 0.0.0.0
      - --port
      - "8100"

  # React + Vite frontend
  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5173"
      - --strictPort

volumes:
  postgres_data:
