# PULSE UI on Fly.io: static build served by nginx. Deploy from frontend/: fly deploy

app = 'pulse-ui'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile.prod'

  [build.args]
    VITE_API_URL = 'https://pulse-api.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '5s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '5s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '256mb'
